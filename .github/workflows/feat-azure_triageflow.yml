# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - TriageFlow

on:
  push:
    branches:
      - feat/azure
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and package
        run: |
          # 1. Cài đặt toàn bộ thư viện để có công cụ build NestJS
          npm ci
          
          # 2. Build code (tạo ra thư mục dist/)
          npm run build
          
          # 3. Xóa sạch thư mục node_modules hiện tại
          rm -rf node_modules
          
          # 4. Cài đặt lại node_modules nhưng CHỈ LẤY các thư viện dành cho Production
          npm ci --omit=dev
          
          # 5. Sinh Prisma Client thẳng vào thư mục node_modules sạch vừa tạo
          npx prisma generate

      - name: Create deployment package
        run: |
          # 6. Đóng gói ra file zip, loại bỏ hoàn toàn thư mục prisma/ và các rác khác
          zip -ry deploy-package.zip dist/ package.json node_modules/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package.zip # Chỉ upload đúng file zip này

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1D1D1EDE93B04748AB5BA9A1860337EE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_48D865BF512A4A24B4C73A1D7485F585 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_61491051142C489A8C12F3BD9545D428 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TriageFlow'
          slot-name: 'Production'
          package: deploy-package.zip # Deploy từ file zip
